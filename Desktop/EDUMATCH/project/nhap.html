<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

              "on-primary-container": "#ffffff",
              "on-primary": "#e5e2e1",
              "on-error": "#ffffff",
              "on-secondary-fixed-variant": "#3b3b3b",
              "surface-container-high": "#e8e8e8",
              "surface-bright": "#f9f9f9",

              "on-background": "#1a1c1c",
              "surface-variant": "#e2e2e2",
              "secondary-fixed-dim": "#acabab",
              "primary-fixed": "#5f5e5e",

              "on-surface": "#1a1c1c",
              "on-tertiary-fixed-variant": "#e2e2e2",
              "secondary-container": "#d6d4d4",
              "surface-tint": "#5f5e5e",
              "primary-fixed-dim": "#474646",

              "inverse-primary": "#c9c6c5",
              "surface-dim": "#dadada",
              "secondary-fixed": "#c7c6c6",
              "inverse-surface": "#2f3131",

              "tertiary-fixed-dim": "#474747",
              "outline": "#777777",

            fontFamily: {

              "body": ["Be Vietnam Pro", "sans-serif"],

      }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #f9f9f9;
        }
        .editorial-title {
            font-family: 'Playfair Display', serif;
            letter-spacing: -0.05em;
        }
        .input-minimal {
            background: transparent;
            border: none;
            border-bottom: 1px solid #c6c6c6;
            border-radius: 0;
            padding-left: 0;
            padding-right: 0;
        }
        .input-minimal:focus {
            box-shadow: none;
            border-bottom: 2px solid #000000;
            outline: none;
        }
    </style>
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen">
<!-- Top Navigation (Shell suppressed for transactional focus, but using style guides for the header branding if it were present) -->
<header class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-xl px-12 py-6 flex justify-between items-center">
<div class="text-2xl font-black tracking-tighter text-neutral-900">The Monolith</div>
<div class="flex gap-8 items-center">
<span class="material-symbols-outlined text-neutral-900">account_circle</span>
</div>
</header>
<main class="flex items-center justify-center min-h-screen px-6 pt-24 pb-12">
<div class="max-w-2xl w-full">
<!-- Center Editorial Card -->
<div class="bg-surface-container-lowest rounded-lg p-12 md:p-16 shadow-[0_4px_40px_rgba(0,0,0,0.07)] transition-all duration-500">
<!-- Editorial Header -->
<div class="mb-12">
<h1 class="editorial-title text-5xl font-black text-primary leading-tight">Đổi mật khẩu</h1>
<div class="mt-4 w-12 h-1 bg-primary"></div>
</div>
<form class="space-y-10">
<!-- Current Password -->
<div class="flex flex-col space-y-2">
<label class="text-[10px] tracking-widest uppercase font-bold text-outline">Current Password</label>
<input class="input-minimal w-full py-3 text-lg placeholder:text-neutral-300" placeholder="••••••••" type="password"/>
</div>
<!-- New Password -->
<div class="flex flex-col space-y-2">
<label class="text-[10px] tracking-widest uppercase font-bold text-outline">New Password</label>
<input class="input-minimal w-full py-3 text-lg placeholder:text-neutral-300" placeholder="••••••••" type="password"/>
<p class="text-[11px] text-neutral-500 mt-2 font-medium">Mật khẩu phải có ít nhất 8 ký tự, bao gồm chữ và số</p>
</div>
<!-- Confirm Password -->
<div class="flex flex-col space-y-2">
<label class="text-[10px] tracking-widest uppercase font-bold text-outline">Confirm New Password</label>
<input class="input-minimal w-full py-3 text-lg placeholder:text-neutral-300" placeholder="••••••••" type="password"/>
</div>
<!-- Action Buttons -->
<div class="flex flex-col sm:flex-row gap-4 pt-8">
<button class="bg-primary text-on-primary px-10 py-4 rounded-xl font-bold transition-all hover:bg-primary-container active:scale-95 duration-300 text-sm tracking-wide" type="submit">
                            Đổi mật khẩu
                        </button>
<button class="bg-transparent border border-outline-variant text-primary px-10 py-4 rounded-xl font-bold transition-all hover:bg-surface-container-low active:scale-95 duration-300 text-sm tracking-wide" type="button">
                            Hủy
                        </button>
</div>
</form>
</div>
<!-- Contextual Metadata / Brand Detail -->
<div class="mt-12 text-center">
<p class="text-[10px] tracking-[0.2em] uppercase text-neutral-400 font-medium">Security Protocol • Monolith Editorial 2024</p>
</div>
</div>
</main>
<!-- Footer - Minimal Version -->
<footer class="w-full py-12 border-t border-neutral-100 dark:border-neutral-900 bg-white">
<div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center px-12 gap-6">
<p class="text-[10px] tracking-widest uppercase text-neutral-400">© 2024 The Monolith Editorial. All rights reserved.</p>
<div class="flex gap-8">
<a class="text-[10px] tracking-widest uppercase text-neutral-400 hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="text-[10px] tracking-widest uppercase text-neutral-400 hover:text-primary transition-colors" href="#">Security Whitepaper</a>
</div>
</div>
</footer>
<!-- Decorative Elements (Asymmetric Tonal Accents) -->
<div class="fixed top-0 right-0 -z-10 w-1/3 h-screen bg-surface-container-low/50 pointer-events-none"></div>
<div class="fixed bottom-0 left-0 -z-10 w-64 h-64 border-t border-r border-outline-variant/10 rounded-tr-[100px] pointer-events-none"></div>
</body></html>
